<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Eid Surprise for Maryam 💝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --emerald: #062f22;
            --gold: #dfb15b;
            --gold-glow: rgba(223, 177, 91, 0.4);
            --glass: rgba(6, 47, 34, 0.75);
            --cream: #fffbee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #0d4b37 0%, #051d15 70%, #020a08 100%);
            font-family: 'Poppins', sans-serif;
            color: var(--cream);
        }

        /* Gatekeeper Start Screen */
        #startScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #051d15 0%, #020a08 100%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .gate-card {
            background: var(--glass);
            border: 1px solid var(--gold);
            padding: 40px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 340px;
        }

        .gate-btn {
            background: linear-gradient(90deg, #dfb15b, #b8860b);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 15px var(--gold-glow);
            width: 100%;
        }

        /* Main Environment */
        .sky-container {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 1;
        }
        .moon { position: absolute; top: 8%; right: 10%; font-size: 4rem; filter: drop-shadow(0 0 15px rgba(255, 235, 165, 0.6)); }
        .lantern { position: absolute; font-size: 2rem; filter: drop-shadow(0 0 10px var(--gold)); }
        .lantern-1 { top: 0; left: 10%; }
        .lantern-2 { top: 0; right: 20%; }

        .intro-header {
            position: absolute; top: 12%; width: 100%;
            text-align: center; z-index: 10; padding: 0 20px; opacity: 0;
        }
        .intro-title { font-family: 'Cinzel Decorative', serif; font-size: 1.8rem; color: #ffffff; text-shadow: 0 0 15px var(--gold-glow); margin-bottom: 8px; }
        .instruction-tap { font-size: 0.95rem; color: var(--gold); }

        /* Animation Stage */
        .stage {
            position: absolute; bottom: 22%; width: 100%; height: 250px;
            display: flex; justify-content: center; align-items: flex-end; z-index: 5;
        }

        .delivery-system { position: relative; width: 150px; height: 120px; cursor: pointer; transform: translateX(-150vw); }

        .truck-body {
            position: absolute; bottom: 15px; width: 140px; height: 75px;
            background: linear-gradient(135deg, #dfb15b 0%, #b8860b 100%);
            border-radius: 15px 22px 10px 10px; border: 1px solid #fff2cc; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .truck-body::before {
            content: ''; position: absolute; top: 8px; right: -1px;
            width: 30px; height: 30px; background: #222; clip-path: polygon(0 0, 100% 40%, 100% 100%, 0 100%);
        }
        .headlight { position: absolute; bottom: 30px; right: -4px; width: 6px; height: 12px; background: #fff; box-shadow: 0 0 15px #fff, 30px 0 40px rgba(255,255,255,0.5); }
        .roof-package { position: absolute; top: -25px; left: 35px; font-size: 2.2rem; filter: drop-shadow(0 0 5px var(--gold)); z-index: 6; }
        .wheel { position: absolute; bottom: 0; width: 28px; height: 28px; background: #111; border: 3px dashed var(--gold); border-radius: 50%; }
        .wheel-back { left: 15px; } .wheel-front { right: 20px; }

        .rider-wrapper { position: absolute; top: -45px; right: 12px; width: 60px; height: 60px; z-index: 2; opacity: 0; transform: scale(0); }
        .rider { font-size: 3.2rem; text-align: center; }

        .speech-bubble {
            position: absolute; bottom: 145px; background: white; color: #222; padding: 12px 18px; border-radius: 20px;
            font-weight: 600; font-size: 0.9rem; width: 250px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            opacity: 0; transform: scale(0.7); pointer-events: none; z-index: 50; border: 2px solid var(--gold);
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-width: 10px 10px 0; border-style: solid; border-color: white transparent;
        }

        /* Final Glassmorphism Card (Stacked layout) */
        .reveal-card {
            position: absolute; top: 10%; width: 90%; max-width: 380px;
            background: var(--glass); border: 2px solid var(--gold); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; padding: 25px 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 80; opacity: 0; transform: scale(0.5); pointer-events: none;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        /* Row 1: Image */
        .image-row img {
            width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); background-color: #222;
        }

        /* Row 2: Text Box */
        .text-row {
            background: rgba(255, 255, 255, 0.08); border: 1px dashed var(--gold); padding: 15px;
            border-radius: 12px; cursor: pointer; width: 100%; min-height: 120px;
            pointer-events: auto;
            position: relative;
        }
        
        .tap-hint {
            font-size: 0.85rem; color: var(--gold); font-weight: 600;
            animation: pulseHint 1.5s infinite; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%;
        }
        @keyframes pulseHint { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .typed-message { font-size: 0.95rem; color: #e0f2fe; line-height: 1.5; font-weight: 300; text-align: center; }
        .signature { font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: var(--gold); margin-top: 5px;}

        canvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 60; }
        .floating-heart { position: absolute; font-size: 20px; pointer-events: none; animation: floatHeart linear forwards; }
        @keyframes floatHeart { from { transform: translateY(0) scale(0.8); opacity: 1; } to { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="startScreen">
        <div class="gate-card">
            <h2 style="font-family:'Cinzel Decorative'; font-size:1.3rem; margin-bottom:10px;">Salam Maryam! ✨</h2>
            <p style="font-size:0.9rem; opacity:0.8;">You have an incoming special Eid package waiting from Aliyu.</p>
            <button class="gate-btn" onclick="initiateSurprise()">Open Package Entrance 📦</button>
        </div>
    </div>

    <div class="sky-container">
        <div class="moon">🌙</div>
        <div class="lantern lantern-1">🪔</div>
        <div class="lantern lantern-2">🪔</div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <div class="intro-header" id="headerGroup">
        <div class="intro-title">A Special Eid Delivery</div>
        <div class="instruction-tap" id="tapPrompt">Tap the truck to open your package 👇</div>
    </div>

    <div class="stage">
        <div class="speech-bubble" id="speechBubble"></div>

        <div class="delivery-system" id="deliveryVan">
            <div class="rider-wrapper" id="riderWrapper">
                <div class="rider" id="riderEmoji">😎</div>
            </div>
            <div class="truck-body">
                <div class="roof-package" id="roofPackage">🎁</div>
                <div class="headlight"></div>
            </div>
            <div class="wheel wheel-back" id="wheelB"></div>
      <div class="wheel wheel-front" id="wheelF"></div>
        </div>
    </div>

    <div class="reveal-card" id="revealCard">
        <div class="image-row">
            <audio id="bgMusic" loop>
    <source src="eid-music.mp3" type="audio/mpeg">
</audio>
<audio id="engineSound">
        <source src="engine.mp3" type="audio/mpeg">
    </audio>
            <img src="/storage/emulated/0/index.html/maryam.png" alt="Maryam's Picture" id="maryamImg">
        </div>
        
        <div class="text-row" id="wishesBox">
            <div class="tap-hint" id="tapHint">👆 Tap here to open wishes 👆</div>
            <div class="typed-message" id="typedTarget"></div>
        </div>

        <div class="signature">Made with love by Aliyu ❤️</div>
    </div>

    <script>
        const startScreen = document.getElementById('startScreen');
        const van = document.getElementById('deliveryVan');
        const wheelF = document.getElementById('wheelF');
        const wheelB = document.getElementById('wheelB');
        const headerGroup = document.getElementById('headerGroup');
        const tapPrompt = document.getElementById('tapPrompt');
        const riderWrap = document.getElementById('riderWrapper');
        const riderEmoji = document.getElementById('riderEmoji');
        const bubble = document.getElementById('speechBubble');
        const card = document.getElementById('revealCard');
        const packageBox = document.getElementById('roofPackage');
        const wishesBox = document.getElementById('wishesBox');
        const tapHint = document.getElementById('tapHint');

        let voiceVoices = [];
        let systemClicked = false;
        let isReadingWishes = false;

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => { voiceVoices = speechSynthesis.getVoices(); };
        }
// STEP 1: Entrance
function initiateSurprise() {
    // Play the background music
    const music = document.getElementById('bgMusic');
    if (music) {
        music.volume = 0.4; // Lowers volume slightly so the Text-to-Speech can still be heard clearly!
        music.play().catch(e => console.log("Audio play blocked: ", e));
    }

    gsap.to(startScreen, {opacity: 0, duration: 0.4, onComplete: () => startScreen.remove()});
    gsap.to(headerGroup, {opacity: 1, duration: 0.5});
    gsap.to([wheelF, wheelB], { rotation: 1080, duration: 2.5, ease: "power2.out" });

    gsap.to(van, {
        x: 0,
        duration: 2.5,
        ease: "power3.out",
        onComplete: () => {
            gsap.to(van, {y: -4, duration: 0.4, yoyo: true, repeat: -1, ease: "sine.inOut"});
            gsap.to(tapPrompt, {scale: 1.05, repeat: -1, yoyo: true, duration: 0.6});
        }
    });
}

 
        // STEP 2: Delivery Van Clicked
        van.addEventListener('click', () => {
            if (systemClicked) return;
            systemClicked = true;

            gsap.to(tapPrompt, { opacity: 0, duration: 0.3 });
            gsap.to(riderWrap, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" });
            
            const message = "Salam Maryam! I have a special Eid package here for you from Aliyu.";
            bubble.innerText = message;
            
            gsap.to(bubble, { opacity: 1, scale: 1, duration: 0.5, delay: 0.2, ease: "back.out(1.2)" });

            // Triggers speech, and grandPackageReveal immediately when finished
            triggerSpeech(message, grandPackageReveal, true);
        });

        function triggerSpeech(text, callback, animateMouth = false) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = speechSynthesis.getVoices();

            const preferredVoice = voices.find(v => v.name.includes('Google UK English Female')) || voices.find(v => v.lang === 'en-US') || voices[0];
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.rate = 0.92; utterance.pitch = 1.05; utterance.volume = 1;
            let talking = true;

            let mouthAnimation;
            if (animateMouth) {
                mouthAnimation = setInterval(() => {
                    if (!talking) return;
                    if (riderEmoji.innerText === "😎") riderEmoji.innerText = "😮";
                    else if (riderEmoji.innerText === "🤩") riderEmoji.innerText = "😲";
                    else riderEmoji.innerText = "😎";
                }, 120);
            }

            utterance.onend = () => {
                talking = false;
                if (animateMouth) clearInterval(mouthAnimation);
                // Execute callback INSTANTLY with no delay
                if (callback) callback();
            };

            speechSynthesis.speak(utterance);
        }

        // STEP 3: Van Drives off immediately, Package Reveals
        function grandPackageReveal() {
            // Instantly hide speech and rider
            gsap.to([bubble, riderWrap], {opacity: 0, scale: 0.5, duration: 0.2});
            
            // Detach package from moving van to keep it center screen
            const rect = packageBox.getBoundingClientRect();
            document.body.appendChild(packageBox);
            packageBox.style.position = 'fixed';
            packageBox.style.left = rect.left + 'px';
            packageBox.style.top = rect.top + 'px';
            packageBox.style.zIndex = 100;

            // Truck instantly speeds away to the right
            gsap.killTweensOf(van); // stop bounce
            gsap.to([wheelF, wheelB], { rotation: "+=1080", duration: 1, ease: "power2.in" });
            gsap.to(van, { x: window.innerWidth + 200, duration: 1, ease: "power2.in" });

            // Package animates up and opens slightly delayed so the van clears out
            gsap.to(packageBox, {
                top: "40%", left: "50%", xPercent: -50, yPercent: -50, scale: 2.5, rotation: 360, duration: 1, ease: "power2.out", delay: 0.3,
                onComplete: () => {
                    createExplosion();
                    packageBox.style.display = 'none';

                    // Show Glass card right in the middle
                    card.style.top = '50%';
                    card.style.left = '50%';
                    card.style.transform = 'translate(-50%, -50%) scale(0.5)';
                    gsap.to(card, {opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.2)", onComplete: () => {
                        card.style.pointerEvents = "auto";
                    }});
                }
            });
        }

        // STEP 4: Tap the box for wishes & humor
        wishesBox.addEventListener('click', () => {
            if(isReadingWishes) return;
            isReadingWishes = true;
            
            tapHint.style.display = 'none';
            document.getElementById('typedTarget').innerHTML = "";
            
            const fullWishes = "Eid Mubarak, Maryam! 🌙 May your days be as bright as your smile and your bank account as full as my stomach after Eid rice! 😂 I pray Allah grants you boundless joy, peace, and answers to all your silent prayers. You deserve all the beautiful things coming your way. Happy Eid! 💖";
            
            let i = 0;
            function run() {
                if(i < fullWishes.length) {
                    document.getElementById('typedTarget').innerHTML += fullWishes.charAt(i);
                    i++;
                    setTimeout(run, 45);
                }
            }
            run();
            
            triggerSpeech(fullWishes, null, false);
        });

        // Ambience Hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = ['❤️','💖','✨'][Math.floor(Math.random()*3)];
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = window.innerHeight + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }, 700);

        // Particle System
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let bits = [];
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        function createExplosion() {
            const emojis = ['❤️','✨','🌸','🎉'];
            for(let i = 0; i < 40; i++) {
                bits.push({
                    x: window.innerWidth / 2, y: window.innerHeight / 2 - 50,
                    sx: (Math.random() - 0.5) * 10, sy: (Math.random() - 0.5) * 10 - 2,
                    age: 1, size: Math.random() * 18 + 16,
                    emoji: emojis[Math.floor(Math.random() * emojis.length)]
                });
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = bits.length - 1; i >= 0; i--) {
                const b = bits[i];
                b.x += b.sx; b.y += b.sy; b.sy += 0.08; b.age -= 0.02;
                ctx.globalAlpha = b.age; ctx.font = `${b.size}px Arial`; ctx.fillText(b.emoji, b.x, b.y);
                if (b.age <= 0) bits.splice(i, 1);
            }
            requestAnimationFrame(render);
        }
        render(); 
    </script>
</body>
</html>
